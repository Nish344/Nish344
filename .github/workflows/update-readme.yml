# Regenerate profile README SVGs from data.json on push / weekly.
# Keeps "last updated" and assets in sync without hand-editing SVG.
name: update-readme-assets

on:
  push:
    paths:
      - "data.json"
      - "scripts/**"
      - ".github/workflows/update-readme.yml"
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Stamp last_updated (schedule only)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          p = Path("data.json")
          data = json.loads(p.read_text())
          data["profile"]["last_updated"] = date.today().isoformat()
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Generate SVGs + README
        run: python3 scripts/generate.py

      - name: Commit if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md data.json
          git commit -m "chore: regenerate profile README assets"
          git push
